<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18161292859"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-18161292859');
</script>
<title>ARD 352 AI Live Pricing Calculator</title>
<meta name="description" content="See exactly what your custom AI automation will cost. Drag the sliders, pick a contract length, get an instant quote." />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { margin: 0; background: #080B12; }
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const formatCurrency = (n) => "$" + Math.round(n).toLocaleString();

const CONTRACT_TERMS = [
  { years: 1, label: "Annual Prepay", discount: 1 / 6, waiveSetup: false, color: "#00E5FF", bg: "rgba(0,229,255,0.08)" },
  { years: 2, label: "Two-Year Prepay", discount: 0.20, waiveSetup: true, color: "#B8FF57", bg: "rgba(184,255,87,0.08)" },
];

function ARDContractModel() {
  const [setupFee, setSetupFee] = useState(1000);
  const [monthlyRetainer, setMonthlyRetainer] = useState(997);
  const [clients, setClients] = useState(1);
  const [selected, setSelected] = useState(null);

  const monthToMonth = monthlyRetainer;
  const annual = monthlyRetainer * 12;

  const calcTerm = (t) => {
    const totalMonths = t.years * 12;
    const discountedMonthly = monthlyRetainer * (1 - t.discount);
    const totalRetainer = discountedMonthly * totalMonths;
    const effectiveSetup = t.waiveSetup ? 0 : setupFee;
    const totalWithSetup = effectiveSetup + totalRetainer;
    const totalWithClients = totalWithSetup * clients;
    const savings = (monthlyRetainer * totalMonths - totalRetainer);
    const annualEquivalent = totalWithSetup / t.years;
    return { ...t, discountedMonthly, totalRetainer, effectiveSetup, totalWithSetup, totalWithClients, savings, annualEquivalent, totalMonths };
  };

  const terms = CONTRACT_TERMS.map(calcTerm);

  return (
    <div style={{
      minHeight: "100vh",
      background: "#080B12",
      color: "#E8EDF5",
      fontFamily: "'DM Mono', 'Courier New', monospace",
      padding: "40px 24px",
      boxSizing: "border-box",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap');
        * { box-sizing: border-box; }
        input[type=range] { -webkit-appearance: none; width: 100%; height: 2px; background: #1E2535; outline: none; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #00E5FF; cursor: pointer; border: 2px solid #080B12; }
        .card { border: 1px solid #1E2535; border-radius: 12px; padding: 24px; cursor: pointer; transition: all 0.2s; }
        .card:hover { transform: translateY(-2px); }
        .selected { border-color: currentColor; }
        .stat-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A6478; margin-bottom: 4px; }
        .stat-value { font-size: 22px; font-weight: 500; }
        .tag { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; letter-spacing: 0.08em; }
        .cta-button { background: linear-gradient(135deg, #00E5FF, #FF2D78); color: #080B12; padding: 14px 32px; border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; display: inline-block; transition: transform 0.2s; }
        .cta-button:hover { transform: translateY(-2px); }
      `}</style>

      <div style={{ maxWidth: 900, margin: "0 auto" }}>
        <div style={{ marginBottom: 8, fontSize: 11, letterSpacing: "0.2em", color: "#5A6478" }}>
          ARD 352 AI BUSINESS
        </div>
        <h1 style={{
          fontFamily: "'Syne', sans-serif",
          fontSize: "clamp(28px, 5vw, 48px)",
          fontWeight: 800,
          margin: "0 0 4px",
          letterSpacing: "-0.02em",
          background: "linear-gradient(135deg, #00E5FF, #FF2D78)",
          WebkitBackgroundClip: "text",
          WebkitTextFillColor: "transparent",
        }}>
          LIVE PRICING CALCULATOR
        </h1>
        <p style={{ color: "#5A6478", fontSize: 13, margin: "0 0 40px" }}>
          One-Time Setup + Monthly Retainer · Prepay Discount Structure
        </p>

        <div style={{
          display: "grid",
          gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))",
          gap: 20,
          marginBottom: 40,
          background: "#0D1120",
          border: "1px solid #1E2535",
          borderRadius: 12,
          padding: 28,
        }}>
          {[
            { label: "Setup Fee (One-Time)", key: "setup", value: setupFee, set: setSetupFee, min: 500, max: 5000, step: 100 },
            { label: "Monthly Retainer", key: "retainer", value: monthlyRetainer, set: setMonthlyRetainer, min: 297, max: 3000, step: 50 },
            { label: "Number of Clients", key: "clients", value: clients, set: setClients, min: 1, max: 50, step: 1 },
          ].map((s) => (
            <div key={s.key}>
              <div className="stat-label">{s.label}</div>
              <div style={{ fontSize: 26, fontWeight: 500, color: "#E8EDF5", margin: "4px 0 12px" }}>
                {s.key === "clients" ? s.value + (s.value === 1 ? " client" : " clients") : formatCurrency(s.value)}
              </div>
              <input
                type="range"
                min={s.min}
                max={s.max}
                step={s.step}
                value={s.value}
                onChange={(e) => s.set(Number(e.target.value))}
              />
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#3A4255", marginTop: 4 }}>
                <span>{s.key === "clients" ? s.min : formatCurrency(s.min)}</span>
                <span>{s.key === "clients" ? s.max : formatCurrency(s.max)}</span>
              </div>
            </div>
          ))}
        </div>

        <div style={{ marginBottom: 32 }}>
          <div className="stat-label" style={{ marginBottom: 12 }}>BASELINE (NO CONTRACT)</div>
          <div style={{
            display: "flex", gap: 16, flexWrap: "wrap",
            background: "#0D1120", border: "1px solid #1E2535",
            borderRadius: 10, padding: "18px 24px",
          }}>
            {[
              { label: "Month-to-Month", val: monthToMonth },
              { label: "Annual (Full Price)", val: annual },
              { label: "Annual × " + clients + " clients", val: annual * clients },
            ].map((b) => (
              <div key={b.label} style={{ flex: 1, minWidth: 140 }}>
                <div className="stat-label">{b.label}</div>
                <div className="stat-value" style={{ color: "#E8EDF5" }}>{formatCurrency(b.val)}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="stat-label" style={{ marginBottom: 16 }}>PREPAY TIERS · CLICK TO COMPARE</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 20, marginBottom: 40 }}>
          {terms.map((t) => (
            <div
              key={t.years}
              className={`card ${selected === t.years ? "selected" : ""}`}
              style={{
                background: selected === t.years ? t.bg : "#0D1120",
                borderColor: selected === t.years ? t.color : "#1E2535",
                color: t.color,
              }}
              onClick={() => setSelected(selected === t.years ? null : t.years)}
            >
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
                <span style={{ fontFamily: "'Syne', sans-serif", fontWeight: 800, fontSize: 22 }}>{t.label}</span>
                <span className="tag" style={{ background: t.bg, color: t.color, border: `1px solid ${t.color}` }}>
                  {Math.round(t.discount * 100)}% OFF/MO
                </span>
              </div>

              <div style={{ marginBottom: 16 }}>
                <div className="stat-label">Discounted Monthly</div>
                <div className="stat-value">{formatCurrency(t.discountedMonthly)}<span style={{ fontSize: 13, color: "#5A6478" }}>/mo</span></div>
              </div>

              <div style={{ borderTop: "1px solid #1E2535", paddingTop: 16, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <div>
                  <div className="stat-label">Setup Fee</div>
                  <div style={{ fontSize: 14, color: "#E8EDF5" }}>{formatCurrency(setupFee)}</div>
                </div>
                <div>
                  <div className="stat-label">Total Retainer</div>
                  <div style={{ fontSize: 14, color: "#E8EDF5" }}>{formatCurrency(t.totalRetainer)}</div>
                </div>
                <div>
                  <div className="stat-label">Contract Total</div>
                  <div style={{ fontSize: 15, fontWeight: 500, color: "#E8EDF5" }}>{formatCurrency(t.totalWithSetup)}</div>
                </div>
                <div>
                  <div className="stat-label">Avg / Year</div>
                  <div style={{ fontSize: 15, fontWeight: 500, color: "#E8EDF5" }}>{formatCurrency(t.annualEquivalent)}</div>
                </div>
                <div style={{ gridColumn: "1/-1" }}>
                  <div className="stat-label">You Save vs. Full Price</div>
                  <div style={{ fontSize: 15, color: t.color, fontWeight: 500 }}>− {formatCurrency(t.savings)}</div>
                </div>
                {clients > 1 && (
                  <div style={{ gridColumn: "1/-1", borderTop: "1px solid #1E2535", paddingTop: 12 }}>
                    <div className="stat-label">× {clients} Clients · Portfolio Total</div>
                    <div style={{ fontSize: 18, fontWeight: 500, color: t.color }}>{formatCurrency(t.totalWithClients)}</div>
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>

        <div style={{ background: "#0D1120", border: "1px solid #1E2535", borderRadius: 12, overflow: "hidden", marginBottom: 40 }}>
          <div style={{ padding: "18px 24px", borderBottom: "1px solid #1E2535" }}>
            <div className="stat-label">FULL COMPARISON TABLE</div>
          </div>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ background: "#080B12" }}>
                  {["Metric", "Month-to-Month", ...CONTRACT_TERMS.map(t => t.label)].map((h, i) => (
                    <th key={h} style={{
                      padding: "12px 20px", textAlign: i === 0 ? "left" : "right",
                      color: "#5A6478", fontWeight: 400, letterSpacing: "0.08em", fontSize: 11,
                      borderBottom: "1px solid #1E2535",
                    }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {[
                  { label: "Effective Monthly", vals: [formatCurrency(monthlyRetainer), ...terms.map(t => formatCurrency(t.discountedMonthly))] },
                  { label: "Discount", vals: ["n/a", ...terms.map(t => Math.round(t.discount * 100) + "%")] },
                  { label: "Setup Fee", vals: [formatCurrency(setupFee), ...terms.map(t => t.waiveSetup ? "Waived" : formatCurrency(t.effectiveSetup))] },
                  { label: "Total Retainer (Term)", vals: ["∞", ...terms.map(t => formatCurrency(t.totalRetainer))] },
                  { label: "All-In Contract Value", vals: ["Month-to-month", ...terms.map(t => formatCurrency(t.totalWithSetup))] },
                  { label: "You Save vs. Full", vals: ["$0", ...terms.map(t => "− " + formatCurrency(t.savings))] },
                  { label: "Avg Annual Cost", vals: [formatCurrency(annual + setupFee), ...terms.map(t => formatCurrency(t.annualEquivalent))] },
                  ...(clients > 1 ? [{ label: `Portfolio (${clients} clients)`, vals: ["n/a", ...terms.map(t => formatCurrency(t.totalWithClients))] }] : []),
                ].map((row, ri) => (
                  <tr key={row.label} style={{ background: ri % 2 === 0 ? "transparent" : "#080B12" }}>
                    <td style={{ padding: "12px 20px", color: "#8892A4", borderBottom: "1px solid #1E2535" }}>{row.label}</td>
                    {row.vals.map((v, vi) => (
                      <td key={vi} style={{
                        padding: "12px 20px", textAlign: "right",
                        color: vi === 0 ? "#E8EDF5" : (CONTRACT_TERMS[vi - 1] ? CONTRACT_TERMS[vi - 1].color : "#8892A4"),
                        borderBottom: "1px solid #1E2535", fontWeight: vi > 0 ? 500 : 400,
                      }}>{v}</td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        {/* Entry Offers */}
        <div style={{ background: "#0D1120", border: "1px solid #1E2535", borderRadius: 12, padding: 28, marginBottom: 20 }}>
          <div className="stat-label" style={{ marginBottom: 4 }}>START HERE · EASY YES OFFERS</div>
          <div style={{ color: "#5A6478", fontSize: 11, marginBottom: 16 }}>Most clients start with one of these. Stacking is where the real money is.</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 20 }}>
            {[
              { color: "#00E5FF", badge: "$97/mo + $297 setup", title: "Missed Call Text Back", note: "When someone calls and nobody answers, they instantly get a text: 'Hey we missed your call, how can we help?' Stops leads from calling your competitor. Live in 1 day." },
              { color: "#B8FF57", badge: "$197/mo", title: "Social Media Content", note: "8 AI-written posts per month, scheduled and auto-posted to Facebook + Instagram. Business stays active and credible with zero effort." },
            ].map((s) => (
              <div key={s.title} style={{ border: `1px solid ${s.color}22`, borderRadius: 10, padding: 18, background: `${s.color}08` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
                  <div style={{ color: s.color, fontWeight: 500, fontSize: 14 }}>{s.title}</div>
                  <span className="tag" style={{ background: `${s.color}22`, color: s.color, border: `1px solid ${s.color}44`, whiteSpace: "nowrap" }}>{s.badge}</span>
                </div>
                <div style={{ color: "#8892A4", fontSize: 12, lineHeight: 1.6 }}>{s.note}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Core + Stacked Plans */}
        <div style={{ background: "#0D1120", border: "1px solid #1E2535", borderRadius: 12, padding: 28, marginBottom: 20 }}>
          <div className="stat-label" style={{ marginBottom: 4 }}>FULL SERVICE PLANS</div>
          <div style={{ color: "#5A6478", fontSize: 11, marginBottom: 16 }}>Stack more services = more value for the client, more recurring revenue for you.</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 20 }}>
            {[
              { color: "#00E5FF", badge: "$297/mo", title: "Chatbot", note: "AI chatbot trained on your business. Answers questions, captures leads, books appointments 24/7. Live in 3–5 days." },
              { color: "#FF2D78", badge: "$497/mo", title: "Starter", note: "Chatbot + Speed-to-Lead AI that texts every new lead in under 60 seconds automatically." },
              { color: "#B8FF57", badge: "$997/mo", title: "Growth", note: "Starter + automated review requests after every job + no-show recovery + appointment reminders." },
              { color: "#FFB347", badge: "$1,997/mo", title: "Scale", note: "Everything + custom AI workflows, dedicated build team, and enterprise integrations." },
            ].map((s) => (
              <div key={s.title}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                  <div style={{ color: s.color, fontWeight: 500, fontSize: 13 }}>{s.title}</div>
                  <span style={{ color: s.color, fontSize: 12, fontWeight: 600 }}>{s.badge}</span>
                </div>
                <div style={{ color: "#8892A4", fontSize: 12, lineHeight: 1.6 }}>{s.note}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Platform Add-On */}
        <div style={{ background: "linear-gradient(135deg, rgba(79,35,240,0.15), rgba(255,87,51,0.1))", border: "1px solid rgba(79,35,240,0.4)", borderRadius: 12, padding: 28, marginBottom: 32 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12, marginBottom: 12 }}>
            <div>
              <div className="stat-label" style={{ marginBottom: 4 }}>ARD 352 AI PLATFORM · ADD-ON</div>
              <div style={{ color: "#E8EDF5", fontWeight: 600, fontSize: 16 }}>Your Own Branded AI Business Dashboard</div>
            </div>
            <span className="tag" style={{ background: "rgba(255,87,51,0.2)", color: "#FF5733", border: "1px solid rgba(255,87,51,0.4)", fontSize: 13, padding: "6px 16px" }}>+$197/mo</span>
          </div>
          <div style={{ color: "#8892A4", fontSize: 13, lineHeight: 1.7 }}>
            Add this to any plan. Your clients get their own dashboard, with all leads, conversations, bookings, and automations in one place. The same software agencies pay $500/mo for, at a fraction of the cost because we're local and build it for you.
          </div>
        </div>

        <div style={{ textAlign: "center", marginBottom: 32 }}>
          <a href="/chatbot.html" className="cta-button">Get Started, Free Audit</a>
          <div style={{ marginTop: 12, color: "#5A6478", fontSize: 12 }}>
            No contracts required on month-to-month plans. Setup fee waived on a two-year prepay.
          </div>
        </div>

        <div style={{ marginTop: 24, textAlign: "center", fontSize: 11, color: "#2A3245", letterSpacing: "0.1em" }}>
          ARD 352 AI · LIVE PRICING CALCULATOR · GETARD352.COM
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ARDContractModel />);
</script>
</body>
</html>
